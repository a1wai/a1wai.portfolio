<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>A1WAI — Portfolio</title>
  <meta name="description" content="Portfolio of A1WAI." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <!-- Background: a blurred, zoomed-in copy of the stream that moves with it -->
  <canvas class="backdrop" id="backdrop" aria-hidden="true"></canvas>

  <!-- The 3D tile stream -->
  <main id="stream" class="stream" aria-label="Portfolio tiles">
    <div class="stream-world" id="stream-world"></div>
  </main>

  <!-- Opened video / About, over a blurred background -->
  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Viewer">
    <button class="lightbox-close" type="button" aria-label="Close">✕</button>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
